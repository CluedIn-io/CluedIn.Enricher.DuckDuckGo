mode: ContinuousDeployment
# The CluedIn version is now encoded in the published package suffix (e.g. .470/.480/.500 - see
# crawler.build.jobs.yml), so this repo's own version no longer needs to track CluedIn. Reset to
# 1.0. Padded 2 full days past the highest pre-existing tag's actual commit date (4.7.1,
# 2026-06-17T17:20:16+10:00) rather than 1 day - GitVersion.Tool 5.9.0 appears to parse
# commits-before using local machine time, not UTC, and a tighter margin was confirmed (on other
# repos in this same migration effort) to silently fail to exclude the old tag.
next-version: 1.0
branches:
  master:
    mode: ContinuousDelivery
  pull-request:
    tag: pr
    increment: None
  develop:
    tag: alpha
  hotfix:
    tag: useBranchName
  ama:
    increment: None
    tracks-release-branches: false
    regex: ^ama[/-]
    is-release-branch: false
    mode: ContinuousDeployment
    track-merge-target: false
    tag: ama
    pre-release-weight: 30000
    prevent-increment-of-merged-branch-version: true
    is-mainline: false
    source-branches:
    - main
    - develop
ignore:
  sha: []
  commits-before: 2026-06-20T00:00:00

